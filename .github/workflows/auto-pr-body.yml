name: Auto PR Body from Commits

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  update-pr-body:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 히스토리

      - name: Get last commits
        id: commits
        run: |
          COMMITS=$(git log -n 5 --pretty=format:"- %s")
          echo "::set-output name=list::$COMMITS"

      - name: Update PR body via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BODY="### 최근 커밋 메시지\n${{ steps.commits.outputs.list }}"
          curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER \
            -d "{\"body\": \"$BODY\"}"
